# Release builds: make a tag vX.Y.Z and push it; .github/workflows/release.yml
# runs this. Locally: goreleaser release --snapshot --clean
version: 2
project_name: linearctl

builds:
  - id: linearctl
    main: ./cmd/linearctl
    binary: linearctl
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
