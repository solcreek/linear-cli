name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: gofmt
        run: test -z "$(gofmt -l acceptance bench)" || { gofmt -l acceptance bench; exit 1; }
      - run: go vet ./...
      # Unit tests, then the acceptance suite and the golden cases against
      # the binary: the behavior linearctl promises.
      - run: make test

  # The acceptance suite drives processes with Unix signals; on Windows the
  # unit tests and a release build show it still builds and holds.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  # The release's npm packaging, without publishing: assemble, pack and
  # install the packages from a build, and dry-run the publish. Only the
  # linux-x64 binary is built here (the release builds each platform on its
  # own); it stands in for the others, which are packed but not run.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and package
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          scripts/package.sh x86_64-unknown-linux-musl linux amd64 0.0.0-ci dist
          for p in linux_arm64 darwin_amd64 darwin_arm64; do
            mkdir -p "dist/linearctl_$p" && cp dist/linearctl_linux_amd64/linearctl "dist/linearctl_$p/"
          done
          mkdir -p dist/linearctl_windows_amd64 && cp dist/linearctl_linux_amd64/linearctl dist/linearctl_windows_amd64/linearctl.exe
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/npm-packages.mjs 0.0.0-ci dist npm-out
      - name: Pack and install like a user
        run: |
          mkdir tgz
          for d in npm-out/*; do (cd "$d" && npm pack --pack-destination ../../tgz); done
          npm install -g --prefix "$RUNNER_TEMP/g" --allow-scripts=@solcreek/linear-cli \
            ./tgz/solcreek-linear-cli-linux-x64-0.0.0-ci.tgz ./tgz/solcreek-linear-cli-0.0.0-ci.tgz
          bin="$RUNNER_TEMP/g/bin/linearctl"
          "$bin" --version
          if head -c 2 "$bin" | grep -q '#!'; then echo "bin is still the Node shim"; exit 1; fi
          "$bin" --demo issue list --limit 1 --json
      - run: scripts/npm-publish.sh npm-out --dry-run
